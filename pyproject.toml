[project]
name = "customsguard"
version = "0.1.0"
description = "CustomsGuard - Autonomous Trade Compliance & Tariff Discrepancy Engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "httpx>=0.27.0",
    "langchain-core>=0.3.0",
    "langflow-base>=0.1.0",
    "openpyxl>=3.1.2",
    "qdrant-client>=1.11.0",
    "pytest>=8.0.0",
    "requests>=2.31.0",
    "streamlit>=1.38.0",
    "uvicorn>=0.29.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
    "ignore::pydantic.warnings.PydanticDeprecatedSince20",
    "ignore::pydantic.warnings.PydanticDeprecatedSince212",
]
