[server]
headless = true
port = 8501
enableCORS = false
enableXsrfProtection = false

[browser]
gatherUsageStats = false

[theme]
base = "dark"
primaryColor = "#A78BFA"
backgroundColor = "#121212"
secondaryBackgroundColor = "#1A1A22"
textColor = "#F8FAFC"
font = "sans-serif"
baseFontSize = 15
borderColor = "#2A2A35"
showSidebarBorder = true

[theme.sidebar]
backgroundColor = "#0B0B0F"
secondaryBackgroundColor = "#16161E"
textColor = "#E2E8F0"
borderColor = "#23232E"
